<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT Studio</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>CRT Studio</h1>
      <p class="muted">在文字、图片或视频上实时预览显像管效果</p>
    </div>
  </header>
  <div class="layout">
    <section aria-label="画面预览">
      <div class="screen">
        <canvas id="screen" width="960" height="540" aria-label="CRT 效果预览"></canvas>
        <p class="message" id="message">正在初始化 WebGL…</p>
      </div>
      <div class="transport">
        <button id="open" type="button">打开图片或视频</button>
        <input id="file" type="file" accept="image/*,video/*,.mp4,.webm,.mov,.m4v,.ogv" hidden>
        <button id="text-mode" type="button" aria-pressed="false">输入文字</button>
        <button id="demo" type="button">测试图</button>
        <button id="original" type="button" aria-pressed="false">原图</button>
        <button id="pause" type="button" aria-pressed="false">暂停动态</button>
      </div>
      <div class="text-editor" id="text-editor" hidden>
        <label class="muted" for="text-input">预览文字</label>
        <textarea id="text-input" rows="2" maxlength="500" placeholder="输入文字，按回车换行" dir="auto">你好，CRT</textarea>
        <label class="control">字号
          <output id="text-size-value" for="text-size">65 px</output>
          <input id="text-size" type="range" min="16" max="360" value="65" aria-label="字号">
        </label>
        <label class="text-option"><input id="text-clarity" type="checkbox" checked>小字清晰度</label>
      </div>
      <p class="muted" id="source" role="status">测试图</p>
    </section>
    <section class="panel" aria-labelledby="controls-title">
      <div class="panel-head">
        <h2 id="controls-title">效果参数</h2>
        <button id="reset" type="button">重置参数</button>
      </div>
      <label class="control">荧光粉排列
        <select id="mask-type">
          <option value="0" selected>竖条</option>
          <option value="1">交错矩形点阵</option>
          <option value="2">关闭</option>
        </select>
      </label>
    </section>
  </div>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
